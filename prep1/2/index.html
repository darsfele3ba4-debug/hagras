    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) { audioCtx = new AudioContext(); }
        if (audioCtx.state === 'suspended') { audioCtx.resume(); }
    }

    function playTone(freq, type, duration, vol = 0.1) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    function playCorrect() {
        initAudio();
        playTone(523.25, 'sine', 0.15, 0.15);
        setTimeout(() => playTone(659.25, 'sine', 0.15, 0.15), 100);
        setTimeout(() => playTone(783.99, 'sine', 0.25, 0.15), 200);
        spawnConfetti();
    }

    function playWrong() {
        initAudio();
        playTone(200, 'sawtooth', 0.3, 0.1);
    }

    function spawnConfetti() {
        const colors = ['#22c55e', '#4ade80', '#10b981', '#ef4444', '#059669'];
        for (let i = 0; i < 25; i++) {
            const conf = document.createElement('div');
            conf.className = 'confetti';
            conf.style.left = Math.random() * 100 + 'vw';
            conf.style.background = colors[Math.floor(Math.random() * colors.length)];
            conf.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's';
            document.body.appendChild(conf);
            setTimeout(() => conf.remove(), 3000);
        }
    }

    function shuffleArray(arr) {
        return arr.map(a => ({sort: Math.random(), value: a}))
            .sort((a, b) => a.sort - b.sort)
            .map(a => a.value);
    }

    function showFeedback(isCorrect, callback) {
        const modal = document.getElementById('feedback-modal');
        const icon = document.getElementById('feedback-icon');
        const title = document.getElementById('feedback-title');
        
        if (isCorrect) {
            playCorrect();
            icon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`;
            title.textContent = 'إجابة صحيحة، أحسنت!';
            title.style.color = 'var(--success)';
        } else {
            playWrong();
            icon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`;
            title.textContent = 'إجابة خاطئة!';
            title.style.color = 'var(--danger)';
        }

        modal.classList.add('active');
        setTimeout(() => {
            modal.classList.remove('active');
            if (callback) callback();
        }, 1300);
    }

    let currentGame = null;
    let currentQuestions = [];
    let qIndex = 0;
    let animInterval = null;
    let wrongAnswers = [];

    function initApp() {
        const menuGrid = document.getElementById('menu-grid');
        menuGrid.innerHTML = '';
        allGamesData.forEach(game => {
            const card = document.createElement('div');
            card.className = 'menu-card';
            card.innerHTML = `
                <div class="icon-container">${game.icon}</div>
                <h3>${game.title}</h3>
                <p>${game.desc}</p>
            `;
            card.onclick = () => startGame(game);
            menuGrid.appendChild(card);
        });
        
        document.body.addEventListener('touchstart', initAudio, { once: true });
        document.body.addEventListener('click', initAudio, { once: true });
    }

    function returnToMenu() {
        clearInterval(animInterval);
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('home-screen').classList.remove('hidden');
        document.getElementById('main-header').classList.remove('hidden');
        document.getElementById('main-footer').classList.remove('hidden');
    }

    function updateProgress() {
        document.getElementById('game-progress').innerText = `${qIndex + 1} / ${currentQuestions.length}`;
    }

    function sendResultToTeacher(score, total) {
        const nameInput = document.getElementById('student-name-input');
        const warning = document.getElementById('name-warning');
        const name = nameInput.value.trim();
        if (!name) {
            warning.style.display = 'block';
            nameInput.focus();
            nameInput.classList.add('shake');
            setTimeout(() => nameInput.classList.remove('shake'), 500);
            return;
        }
        warning.style.display = 'none';
        const message = "مرحبًا أستاذ محمد هجرس 🌟\n" +
            "الطالب/ـة: " + name + "\n" +
            "الدرس: " + LESSON_FULL_NAME + "\n" +
            "اللعبة: " + currentGame.title + "\n" +
            "النتيجة: " + score + " من " + total;
        const url = "https://wa.me/" + TEACHER_WHATSAPP + "?text=" + encodeURIComponent(message);
        window.open(url, '_blank');
    }

                ${summaryHTML}
                <div class="send-result-box">
                    <h3>📤 أرسل نتيجتك للأستاذ محمد هجرس</h3>
                    <input type="text" id="student-name-input" class="name-input" placeholder="اكتب اسمك هنا ✍️">
                    <button class="btn whatsapp-send-btn" onclick="sendResultToTeacher(${score}, ${currentQuestions.length})">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12.031 0C5.385 0 0 5.385 0 12.031c0 2.656.843 5.12 2.26 7.15L.626 24l5.01-1.61c1.983 1.25 4.27 1.91 6.395 1.91 6.646 0 12.03-5.385 12.03-12.031S18.677 0 12.031 0zm6.544 17.202c-.273.766-1.58 1.464-2.185 1.503-.56.035-1.28.23-4.085-.86-3.39-1.32-5.59-4.78-5.736-4.97-.145-.19-1.37-1.82-1.37-3.475 0-1.655.857-2.47 1.164-2.8.307-.33.67-.413.89-.413.22 0 .44 0 .633.01.205.01.482-.08.736.53.264.634.904 2.203.984 2.366.08.163.133.353.033.553-.1.2-.153.326-.307.506-.154.18-.32.38-.453.506-.153.153-.314.316-.134.626.18.31.8 1.32 1.71 2.13.176.157.363.31.558.45 1.05.76 1.83 1.05 2.13 1.18.3.13.474.11.652-.09.18-.205.766-.893.97-1.2.204-.307.41-.256.69-.153.28.103 1.77.836 2.074.99.304.153.506.23.582.356.076.126.076.73-.197 1.496z"/></svg>
                        إرسال النتيجة عبر واتساب
                    </button>
                    <p id="name-warning" class="name-warning" style="display:none;">من فضلك اكتب اسمك أولاً ✍️</p>
                </div>
                <button class="btn" style="font-size:1.2rem; padding:15px 30px; margin-top: 20px;" onclick="returnToMenu()">العودة للقائمة الرئيسية</button>
            </div>
        `;
    }

    function startGame(gameData) {
        initAudio();
        currentGame = gameData;
        currentQuestions = shuffleArray([...gameData.questions]);
        qIndex = 0;
        wrongAnswers = [];
        
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('main-header').classList.add('hidden');
        document.getElementById('main-footer').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('game-title').innerText = gameData.title;
        
        renderNextState();
    }

    function renderNextState() {
        if (qIndex >= currentQuestions.length) {
            gameComplete();
            return;
        }

        const gc = document.getElementById('game-container');
        gc.innerHTML = '';
        updateProgress();

        if (currentGame.type === 'mcq') {
            renderMCQ(gc);
        } else if (currentGame.type === 'bubbles') {
            renderBubbles(gc);
        } else if (currentGame.type === 'shooting') {
            renderShooting(gc);
        } else if (currentGame.type === 'true_false') {
            renderTrueFalse(gc);
        } else if (currentGame.type === 'genius') {
            renderGenius(gc);
        }
    }

    // 1. اختيارات (MCQ)
    function renderMCQ(container) {
        const qData = currentQuestions[qIndex];
        const correctText = qData.options[qData.ans];
        const shuffledOptions = shuffleArray([...qData.options]);

        const btnContainer = document.createElement('div');
        btnContainer.className = 'options-grid';
        
        let isAnswered = false;

        shuffledOptions.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = opt;
            btn.onclick = () => {
                if(isAnswered) return;
                isAnswered = true;

                if (opt === correctText) {
                    btn.classList.add('btn-correct');
                    showFeedback(true, () => { qIndex++; renderNextState(); });
                } else {
                    btn.classList.add('btn-wrong');
                    wrongAnswers.push({ question: qData.q, correct: correctText, selected: opt });
                    showFeedback(false, () => { qIndex++; renderNextState(); });
                }
            };
            btnContainer.appendChild(btn);
        });

        const qBox = document.createElement('div');
        qBox.className = 'question-box';
        qBox.innerText = qData.q;
        
        container.appendChild(qBox);
        container.appendChild(btnContainer);
    }

    // 2. صح أم خطأ
    function renderTrueFalse(container) {
        const qData = currentQuestions[qIndex];
        const correctText = qData.options[qData.ans];

        const qBox = document.createElement('div');
        qBox.className = 'question-box';
        qBox.innerText = qData.q;
        
        const tfContainer = document.createElement('div');
        tfContainer.className = 'tf-grid';
        
        let isAnswered = false;

        const fixedOptions = ["صح", "خطأ"];

        fixedOptions.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.style.flex = '1';
            btn.style.minWidth = '200px';
            btn.style.fontSize = '2rem';
            btn.style.padding = '30px';
            btn.style.justifyContent = 'center';
            
            if(opt === "صح") {
                btn.style.background = "linear-gradient(to bottom, #10b981, #059669)";
                btn.style.borderBottomColor = "#047857";
            } else {
                btn.style.background = "linear-gradient(to bottom, #ef4444, #dc2626)";
                btn.style.borderBottomColor = "#b91c1c";
            }

            btn.innerText = opt;
            
            btn.onclick = () => {
                if(isAnswered) return;
                isAnswered = true;

                if (opt === correctText) {
                    btn.classList.add('btn-correct');
                    showFeedback(true, () => { qIndex++; renderNextState(); });
                } else {
                    btn.classList.add('btn-wrong');
                    wrongAnswers.push({ question: qData.q, correct: correctText, selected: opt });
                    showFeedback(false, () => { qIndex++; renderNextState(); });
                }
            };
            tfContainer.appendChild(btn);
        });

        container.appendChild(qBox);
        container.appendChild(tfContainer);
    }

    // 3. الفقاعات المتساقطة
    function renderBubbles(container) {
        clearInterval(animInterval);
        const qData = currentQuestions[qIndex];
        const correctText = qData.options[qData.ans];
        const shuffledOptions = shuffleArray([...qData.options]);

        const qBox = document.createElement('div');
        qBox.className = 'question-box';
        qBox.innerText = qData.q;
        
        const area = document.createElement('div');
        area.className = 'bubbles-area';

        let bubbles = [];
        let isAnswered = false;

        shuffledOptions.forEach((opt, index) => {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = `<span>${opt}</span>`;
            
            let leftPos = 2 + (index * 24); 
            bubble.style.left = leftPos + '%';
            
            let topPos = -100 - (Math.random() * 80);
            bubble.style.top = topPos + 'px';
            
            /* سرعة سقوط أعلى قليلاً */
            let speed = 0.55 + Math.random() * 0.45; 

            bubble.onclick = () => {
                if (isAnswered) return;
                isAnswered = true;
                clearInterval(animInterval);
                if (opt === correctText) {
                    bubble.style.background = 'var(--success)';
                    bubble.style.color = 'white';
                    showFeedback(true, () => { qIndex++; renderNextState(); });
                } else {
                    bubble.style.background = 'var(--danger)';
                    bubble.style.color = 'white';
                    wrongAnswers.push({ question: qData.q, correct: correctText, selected: opt });
                    showFeedback(false, () => { qIndex++; renderNextState(); });
                }
            };

            area.appendChild(bubble);
            bubbles.push({ el: bubble, top: topPos, speed: speed, isCorrect: opt === correctText, active: true });
        });

        container.appendChild(qBox);
        container.appendChild(area);
        
        let hint = document.createElement('div');
        hint.style.textAlign = 'center';
        hint.style.marginTop = '15px';
        hint.style.color = 'var(--primary)';
        hint.style.fontWeight = 'bold';
        hint.style.fontSize = '1.1rem';
        hint.innerHTML = `💡 اضغط على الفقاعة التي تحمل الإجابة الصحيحة قبل أن تسقط!`;
        container.appendChild(hint);

        let areaHeight = 400;

        animInterval = setInterval(() => {
            if (isAnswered) return;
            bubbles.forEach(b => {
                if (!b.active) return;
                b.top += b.speed;
                b.el.style.top = b.top + 'px';
                b.el.style.transform = `translateX(${Math.sin(b.top / 20) * 5}px)`;

                if (b.top > areaHeight) {
                    b.active = false;
                    b.el.style.display = 'none';
                    if (b.isCorrect && !isAnswered) {
                        isAnswered = true;
                        clearInterval(animInterval);
                        wrongAnswers.push({ question: qData.q, correct: correctText, selected: "سقطت دون اختيار" });
                        showFeedback(false, () => { qIndex++; renderNextState(); });
                    }
                }
            });
        }, 20);
    }

    // 4. التنشين والاصطياد
    function renderShooting(container) {
        clearInterval(animInterval);
        const qData = currentQuestions[qIndex];
        const correctText = qData.options[qData.ans];
        const shuffledOptions = shuffleArray([...qData.options]);

        const qBox = document.createElement('div');
        qBox.className = 'question-box';
        qBox.innerText = qData.q;
        
        const area = document.createElement('div');
        area.className = 'shooting-area';

        let isAnswered = false;

        shuffledOptions.forEach((opt, index) => {
            const bird = document.createElement('div');
            bird.className = 'target-bird';
            
            bird.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg> <span>${opt}</span>`;
            
            let topPos = 15 + (index * 20); 
            bird.style.top = topPos + '%';
            
            let pos = (index % 2 === 0) ? -200 : window.innerWidth;
            let speed = (Math.random() * 2.5 + 1.5) * ((index % 2 === 0) ? 1 : -1);
            
            bird.style.left = pos + 'px';

            bird.onclick = () => {
                if(isAnswered) return;
                isAnswered = true;

                if (opt === correctText) {
                    bird.style.background = 'var(--success)';
                    bird.style.color = 'white';
                    bird.style.borderColor = 'white';
                    showFeedback(true, () => { qIndex++; renderNextState(); });
                } else {
                    bird.style.background = 'var(--danger)';
                    bird.style.color = 'white';
                    bird.style.borderColor = 'white';
                    wrongAnswers.push({ question: qData.q, correct: correctText, selected: opt });
                    showFeedback(false, () => { qIndex++; renderNextState(); });
                }
            };

            area.appendChild(bird);

            animInterval = setInterval(() => {
                if (isAnswered) return;
                pos += speed;
                if (pos > window.innerWidth + 50) pos = -250;
                if (pos < -250) pos = window.innerWidth + 50;
                bird.style.left = pos + 'px';
            }, 20);
        });

        container.appendChild(qBox);
        container.appendChild(area);
        
        let hint = document.createElement('div');
        hint.style.textAlign = 'center';
        hint.style.marginTop = '15px';
        hint.style.color = 'var(--primary)';
        hint.style.fontWeight = 'bold';
        hint.style.fontSize = '1.1rem';
        hint.style.display = 'flex';
        hint.style.alignItems = 'center';
        hint.style.justifyContent = 'center';
        hint.style.gap = '8px';
        hint.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg> اضغط على الإجابة الصحيحة وهي تتحرك!`;
        container.appendChild(hint);
    }

    // 5. تحدي العباقرة (سباق مع الوقت)
    function renderGenius(container) {
        clearInterval(animInterval);
        const qData = currentQuestions[qIndex];
        const correctText = qData.options[qData.ans];
        const shuffledOptions = shuffleArray([...qData.options]);

        const qBox = document.createElement('div');
        qBox.className = 'question-box genius-box';
        qBox.innerHTML = `⚡ ${qData.q}`;

        const timerWrap = document.createElement('div');
        timerWrap.className = 'genius-timer-wrap';
        const timerBar = document.createElement('div');
        timerBar.className = 'genius-timer-bar';
        timerWrap.appendChild(timerBar);

        const btnContainer = document.createElement('div');
        btnContainer.className = 'options-grid';

        let isAnswered = false;
        let timeLeft = 12000;
        const totalTime = timeLeft;

        function finish(isCorrect, selectedText) {
            if (isAnswered) return;
            isAnswered = true;
            clearInterval(animInterval);
            if (isCorrect) {
                showFeedback(true, () => { qIndex++; renderNextState(); });
            } else {
                wrongAnswers.push({ question: qData.q, correct: correctText, selected: selectedText || "انتهى الوقت! ⏱️" });
                showFeedback(false, () => { qIndex++; renderNextState(); });
            }
        }

        shuffledOptions.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = opt;
            btn.onclick = () => {
                if (isAnswered) return;
                if (opt === correctText) {
                    btn.classList.add('btn-correct');
                    finish(true);
                } else {
                    btn.classList.add('btn-wrong');
                    finish(false, opt);
                }
            };
            btnContainer.appendChild(btn);
        });

        container.appendChild(qBox);
        container.appendChild(timerWrap);
        container.appendChild(btnContainer);

        let hint = document.createElement('div');
        hint.className = 'genius-hint';
        hint.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg> سباق مع الوقت! أجب بسرعة قبل نفاد الثواني`;
        container.appendChild(hint);

        animInterval = setInterval(() => {
            if (isAnswered) return;
            timeLeft -= 100;
            let pct = Math.max(0, (timeLeft / totalTime) * 100);
            timerBar.style.width = pct + '%';
            if (timeLeft <= 0) {
                clearInterval(animInterval);
                finish(false, null);
            }
        }, 100);
    }

    window.onload = initApp;
</script>
</body>
</html>
